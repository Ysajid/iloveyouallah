<style>
/* ---------------------------------------------------------------
   The 99 Names Journey

   Colours come from the playroom: cream walls, the rainbow arch
   (teal, butter, apricot, peach) and the rug. Everything is held a
   little below full strength — pastel reads as calm, the same hues at
   full saturation read as a toy shop.

   Built for a tablet held in two hands. Everything is big, nothing
   flashes, no sound unless you ask.
   --------------------------------------------------------------- */

:root {
  /* surfaces, warm rather than white */
  --paper: #fbf6ec;
  --sand: #f3e9d8;
  --card: #fffdf8;
  --wood: #e4cda6;
  --line: #e7dcc7;
  --line-soft: #f0e7d7;

  /* ink. Warm dark brown, not black: softer under a bedside lamp. */
  --ink: #3b332a;
  --ink-soft: #6e6455;
  --ink-faint: #736a5e;   /* darkened until it cleared WCAG AA on cream */

  /* the arch and the rug */
  --butter: #f5ce63;
  --butter-deep: #e0a81f;
  --apricot: #f0a24e;
  --apricot-deep: #d2792a;
  --coral: #f0907a;
  --sky: #63c0d1;
  --teal: #3f93a3;
  --teal-deep: #2e7d8a;
  --mint: #a9dcc4;
  --lavender: #cdbfe0;
  --peach: #f7cdb0;
  --leaf: #6bb886;
  --berry: #dd6459;

  --tap: 56px;

  --font-ui: "Noto Sans Bengali", "Hind Siliguri", "Nirmala UI", "Bangla Sangam MN",
             "Kalpurush", "Vrinda", -apple-system, BlinkMacSystemFont, "Segoe UI",
             system-ui, sans-serif;
  --font-ar: "Amiri", "Scheherazade New", "Traditional Arabic", "Geeza Pro",
             "Noto Naskh Arabic", "Al Bayan", "Times New Roman", serif;

  --lift: 0 2px 5px rgba(90, 70, 40, .07), 0 10px 26px -12px rgba(90, 70, 40, .18);
  --lift-sm: 0 1px 3px rgba(90, 70, 40, .08), 0 5px 14px -8px rgba(90, 70, 40, .16);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(900px 620px at 12% -8%, #fffdf6 0%, transparent 62%),
    radial-gradient(760px 520px at 96% 4%, #fdf1e2 0%, transparent 58%),
    linear-gradient(174deg, var(--paper) 0%, var(--sand) 100%);
  background-attachment: fixed;
}

/* Soft shapes drifting behind everything, like light through a window.
   Replaces the old star field, which only worked on a dark screen. */
#bokeh {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
#bokeh i {
  position: absolute;
  border-radius: 50%;
  /* kept very faint: in a big empty area anything stronger reads as a
     stain rather than as light through a window */
  filter: blur(26px);
  animation: float 22s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) }
  50%      { transform: translateY(-14px) }
}

#app { position: relative; z-index: 1; }

.screen {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.on { display: block; }

.wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 48px; }

/* ---------- shared bits ---------- */

button {
  font-family: inherit;
  font-size: 1rem;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5em;
  min-height: var(--tap);
  padding: 0 22px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--lift-sm);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--ink);
  transition: transform .12s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.96); box-shadow: none; }
.btn[disabled] { color: var(--ink-faint); box-shadow: none; }

.btn-gold {
  background: linear-gradient(170deg, var(--butter) 0%, var(--apricot) 100%);
  border-color: #e6a63f;
  color: #4a3208;
  box-shadow: 0 2px 4px rgba(150, 100, 20, .16), 0 10px 22px -12px rgba(190, 120, 30, .5);
}
.btn-wide { width: 100%; }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; }

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  max-width: 720px;
  margin: 0 auto;
}
.topbar .grow { flex: 1; }
.iconbtn {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--lift-sm);
  font-size: 1.25rem;
  color: var(--ink-soft);
}
.iconbtn:active { transform: scale(.94); }

.lang {
  display: flex;
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--lift-sm);
}
.lang button {
  padding: 0 14px;
  height: 44px;
  font-size: .95rem;
  font-weight: 700;
  color: var(--ink-faint);
}
.lang button.on { background: var(--butter); color: #4a3208; }

h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 700; }
.eyebrow {
  font-size: .8rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 700;
}

/* ---------- profile picker ---------- */

#profiles .wrap { padding-top: 11vh; text-align: center; }
.crescent { font-size: 3.4rem; line-height: 1; }
#profiles h1 { font-size: 1.9rem; margin: 18px 0 6px; }
#profiles p.sub { color: var(--ink-soft); margin: 0 0 30px; font-size: 1.05rem; }

.who { display: grid; gap: 12px; margin-bottom: 18px; }
.who .row { display: flex; gap: 10px; }
.who .name {
  flex: 1;
  min-height: 62px;
  border-radius: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--lift-sm);
  font-size: 1.2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  color: var(--ink);
}
.who .name small { color: var(--ink-faint); font-weight: 600; font-size: .85rem; }
.who .del {
  width: 62px;
  border-radius: 18px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-faint);
  font-size: 1.1rem;
}

.newname { display: flex; gap: 10px; margin-top: 4px; }
.newname input {
  flex: 1;
  min-height: 62px;
  border-radius: 18px;
  padding: 0 20px;
  font-size: 1.15rem;
  font-family: inherit;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 3px rgba(90, 70, 40, .06);
}
.newname input::placeholder { color: var(--ink-faint); }
.newname input:focus { outline: 2px solid var(--apricot); outline-offset: 1px; }

/* ---------- the map: a chart of the ocean, islands on it ---------- */

.ocean {
  position: relative;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* the cartouche: title and progress, like a label printed on the chart */
.cartouche {
  position: relative;
  z-index: 3;
  text-align: center;
  padding: 14px 20px 16px;
  margin: 0 16px 10px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--lift);
}
.cartouche h1 { font-size: 1.5rem; margin: 6px 0 0; }
.cartouche .progressline { margin: 12px auto 8px; max-width: 260px; }
.cartouche .who-now { margin-top: 2px; min-height: 44px; font-size: .95rem; color: var(--ink-soft); }

.progressline {
  height: 9px;
  border-radius: 99px;
  background: var(--sand);
  border: 1px solid var(--line);
  overflow: hidden;
}
.progressline i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--butter), var(--apricot));
  transition: width .5s ease;
}

/* The chart. Longer on a narrow screen so the island labels never collide:
   spacing between islands is a fraction of the chart height, while the
   labels are a fixed size in points. */
.chart {
  position: relative;
  width: calc(100% - 24px);
  margin: 0 12px;
  /* height is set in script, from the labels actually rendered — see
     sizeChart(). This is only the fallback before that runs. */
  aspect-ratio: 1 / 4.4;
  border-radius: 26px;
  overflow: hidden;
  border: 1px solid #cfe3e8;
  box-shadow: var(--lift), inset 0 0 40px rgba(40, 110, 130, .10);
}

.chart .sea {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* the swell drifts, slowly */
.chart .swell { animation: drift 26s linear infinite; }
@keyframes drift {
  from { transform: translateX(0) }
  to   { transform: translateX(8px) }
}

/* One island. Centred on its point of the route; the label hangs underneath
   and is still part of the button, so it is part of the tap target. */
.isle {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 0;
  z-index: 2;
  /* the label holds still on purpose — only the land bobs */
}

.isle .art {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  animation: bob 7.5s ease-in-out infinite;
  animation-delay: var(--bob);
}
.isle .art svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes bob {
  0%, 100% { transform: translateY(-1.5%) }
  50%      { transform: translateY(1.5%) }
}

.isle .em {
  position: absolute;
  left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  font-size: clamp(1.15rem, 5.2vw, 1.9rem);
  filter: drop-shadow(0 1px 3px rgba(60, 45, 20, .3));
}
.isle .flag {
  position: absolute;
  left: 76%; top: 16%;
  transform: translate(-50%, -50%);
  font-size: .8rem;
  font-weight: 800;
  color: #fff;
  background: var(--leaf);
  width: 1.55em; height: 1.55em;
  display: grid; place-items: center;
  border-radius: 99px;
  box-shadow: 0 2px 5px rgba(40, 90, 60, .35);
}

.isle .plate {
  position: absolute;
  left: 50%;
  top: 78%;
  transform: translateX(-50%);
  width: 104%;
  min-width: 124px;
  padding: 6px 9px 7px;
  border-radius: 14px;
  background: rgba(255, 253, 248, .94);
  border: 1px solid var(--line);
  box-shadow: var(--lift-sm);
}
.isle .nth {
  font-size: .62rem;
  letter-spacing: .07em;
  color: var(--ink-faint);
  font-weight: 700;
}
.isle .ttl {
  font-size: .84rem;
  font-weight: 700;
  line-height: 1.32;
  margin-top: 1px;
  color: var(--ink);
}
.isle .stars { margin-top: 3px; font-size: .76rem; letter-spacing: .1em; color: var(--butter-deep); }
.isle .stars .off { color: #dccfb6; }   /* an empty slot, still visible */
.isle .stars.locked-note {
  color: var(--ink-faint);
  letter-spacing: 0;
  font-size: .64rem;
  line-height: 1.32;
}

.isle.locked .art { animation: none; }
.isle.locked .em { filter: grayscale(.8) opacity(.6); }
.isle.locked .plate { background: rgba(255, 253, 248, .8); }
.isle.done .plate { border-color: rgba(107, 184, 134, .5); }

.isle:not(.locked):active .art { transform: scale(.94); }

.boat {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: clamp(.95rem, 4vw, 1.4rem);
  z-index: 3;
  pointer-events: none;
  filter: drop-shadow(0 2px 4px rgba(30, 80, 100, .35));
  animation: sail 5.5s ease-in-out infinite;
}
@keyframes sail {
  0%, 100% { transform: translate(-50%, -50%) rotate(-6deg) }
  50%      { transform: translate(-50%, -62%) rotate(6deg) }
}

.mapfoot { margin: 26px 16px 0; }

@media (min-width: 560px) {
  .isle .ttl { font-size: .98rem; }
  .isle .nth { font-size: .7rem; }

/* The eleven islands, in journey order. One island a night.

   y down the route (0 = where you start, 1 = the last island). The chart is
   taller than the screen, so the journey is something you scroll along.

   hue/sat/light is the island's colour, taken from the playroom: the rainbow
   arch and the rug. Kept pale and low-saturation on purpose — a soft pastel
   reads as calm, where the same hue at full strength reads as a toy shop.

   size nudges a few islands bigger or smaller so the archipelago does not
   look stamped out, and seed picks which coastline shape it gets.
   Both builds read all of this, so the map matches in each. */
const ISLANDS = [
  { i: 1,  emoji: "🤍", bn: "মায়ার দ্বীপ",      en: "Island of Mercy",       x: 0.30, y: 0.035, size: 1.00, seed: 0, hue: 8,   sat: 58, light: 80 },
  { i: 2,  emoji: "🕊️", bn: "ক্ষমার দ্বীপ",      en: "Island of Forgiveness", x: 0.64, y: 0.122, size: 0.92, seed: 1, hue: 196, sat: 55, light: 78 },
  { i: 3,  emoji: "👑", bn: "রাজার দ্বীপ",      en: "Island of the King",    x: 0.33, y: 0.210, size: 1.08, seed: 2, hue: 44,  sat: 72, light: 74 },
  { i: 4,  emoji: "🌱", bn: "সৃষ্টির দ্বীপ",     en: "Island of Making",      x: 0.69, y: 0.298, size: 0.95, seed: 3, hue: 150, sat: 42, light: 76 },
  { i: 5,  emoji: "🎁", bn: "দানের দ্বীপ",      en: "Island of Giving",      x: 0.36, y: 0.386, size: 1.02, seed: 4, hue: 24,  sat: 70, light: 78 },
  { i: 6,  emoji: "💡", bn: "আলোর দ্বীপ",       en: "Island of Light",       x: 0.68, y: 0.474, size: 0.90, seed: 0, hue: 50,  sat: 78, light: 76 },
  { i: 7,  emoji: "🔭", bn: "জ্ঞানের দ্বীপ",     en: "Island of Knowing",     x: 0.31, y: 0.562, size: 1.05, seed: 1, hue: 275, sat: 38, light: 80 },
  { i: 8,  emoji: "⚡", bn: "শক্তির দ্বীপ",      en: "Island of Strength",    x: 0.66, y: 0.650, size: 0.98, seed: 2, hue: 14,  sat: 60, light: 76 },
  { i: 9,  emoji: "⚖️", bn: "ন্যায়ের দ্বীপ",     en: "Island of Fairness",    x: 0.34, y: 0.738, size: 0.93, seed: 3, hue: 176, sat: 40, light: 74 },
  { i: 10, emoji: "♾️", bn: "চিরকালের দ্বীপ",   en: "Island of Forever",     x: 0.68, y: 0.826, size: 1.00, seed: 4, hue: 215, sat: 48, light: 79 },
  { i: 11, emoji: "🏔️", bn: "মহিমার দ্বীপ",     en: "Island of Greatness",   x: 0.47, y: 0.930, size: 1.22, seed: 2, hue: 300, sat: 32, light: 81 },
];

/* Five coastlines, as closed paths on a 100x100 box centred on 50,50.
   Hand-rolled rather than random so every build draws the same archipelago
   and the kids learn the shape of their own map. */
const COASTS = [
  "M12,56 C10,40 24,28 40,26 C54,24 64,16 76,22 C90,29 92,44 88,56 C84,70 70,78 54,79 C36,80 16,72 12,56 Z",
  "M14,52 C16,36 28,22 46,22 C62,22 74,28 84,40 C92,50 90,64 78,72 C64,81 44,82 30,76 C18,71 12,62 14,52 Z",
  "M16,58 C12,44 20,30 34,24 C50,17 68,18 80,28 C92,38 94,54 86,64 C76,76 58,82 42,80 C28,78 19,70 16,58 Z",
  "M13,50 C18,34 32,24 50,25 C66,26 80,32 87,44 C93,55 88,68 74,74 C58,81 38,80 25,72 C15,66 11,58 13,50 Z",
  "M15,54 C14,38 26,25 44,23 C60,21 76,24 85,35 C94,46 91,62 80,70 C67,79 47,81 32,75 C20,70 15,63 15,54 Z",

/* ---------------------------------------------------------------------------
   The coastline, as points rather than a path string.

   An isometric island is not a picture — it is a shape on the ground that gets
   projected and extruded, so the drawing code needs the outline as coordinates
   it can push around. Same harmonics as the old path data, same seed, so the
   archipelago keeps the shape the kids already know.

   Shared by every build: the web draws these with SVG polygons, and the native
   build walks the same points into a Path.
   --------------------------------------------------------------------------- */

/* Radius of the coastline at a given angle, on a unit circle. */
function coastRadius(angle, seed) {
  var s = seed * 1.7;
  return 1
    + 0.11 * Math.sin(angle * 2 - s)
    + 0.07 * Math.sin(angle * 3 + s * 1.3)
    + 0.035 * Math.sin(angle * 5 - s * 0.7);
}

/* The outline as `count` points, going clockwise on screen. */
function coastPoints(seed, count) {
  var pts = [];
  for (var k = 0; k < count; k++) {
    var a = (Math.PI * 2 * k) / count;
    var r = coastRadius(a, seed);
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, a: a });
  }
  return pts;
}

          today: "আজকে কেউ কেঁদে ফেললে তার পাশে গিয়ে বসো।" },
    en: { meaning: "The Very Gentle One",
          about: "When you are hurt, it matters to Allah. He looks at you very gently.",
          today: "If someone cries today, go and sit beside them." } },

  { n: 47, i: 1, ar: "الْوَدُودُ", tr: "Al-Wadūd",
    bn: { meaning: "যিনি ভালোবাসেন",
          about: "আল্লাহ তোমাকে ভালোবাসেন। তুমি ভুল করলেও সেই ভালোবাসা কমে না।",
          today: "আজকে আম্মু আর আব্বুকে বলো, আমি তোমাকে ভালোবাসি।" },
    en: { meaning: "The Loving One",
          about: "Allah loves you. Even when you make a mistake, that love does not get smaller.",
          today: "Tell your mum and dad today: I love you." } },

  { n: 32, i: 1, ar: "الْحَلِيمُ", tr: "Al-Haleem",
    bn: { meaning: "যিনি সহজে রাগ করেন না",
          about: "মানুষ ভুল করলে আল্লাহ সাথে সাথে রাগ করেন না। তিনি সময় দেন।",
          today: "আজকে রাগ এলে দশ পর্যন্ত গোনো, তারপর কথা বলো।" },
    en: { meaning: "The One Who Does Not Get Angry Quickly",
          about: "When people slip up, Allah does not get angry straight away. He gives them time.",
          today: "When you feel angry today, count to ten before you speak." } },

  { n: 99, i: 1, ar: "الصَّبُورُ", tr: "As-Saboor",
    bn: { meaning: "যিনি অপেক্ষা করতে পারেন",
          about: "আল্লাহ কখনো তাড়াহুড়ো করেন না। তিনি শান্তভাবে অপেক্ষা করেন।",
          today: "আজকে লাইনে দাঁড়ালে ঠেলাঠেলি না করে শান্ত হয়ে দাঁড়াও।" },
    en: { meaning: "The One Who Can Wait",
          about: "Allah is never in a hurry. He waits, calmly.",
          today: "In a queue today, stand quietly instead of pushing." } },

  { n: 79, i: 1, ar: "الْبَرُّ", tr: "Al-Barr",
    bn: { meaning: "যিনি শুধু ভালো করেন",
          about: "আল্লাহর কাছ থেকে শুধু ভালো জিনিস আসে। তিনি কারো ক্ষতি চান না।",
          today: "আজকে একটা ভালো কাজ করো, কিন্তু কাউকে বলো না।" },
    en: { meaning: "The One Who Only Does Good",
          about: "Only good things come from Allah. He does not want harm for anyone.",
          today: "Do one good thing today and tell nobody about it." } },

  { n: 30, i: 1, ar: "اللَّطِيفُ", tr: "Al-Lateef",
    bn: { meaning: "যিনি নরম আর যত্নশীল",
          about: "আল্লাহ ছোট ছোট জিনিসও খেয়াল রাখেন। একটা পিঁপড়ার পা-ও তিনি দেখেন।",
          today: "আজকে খুব নরম হাতে একটা গাছের পাতা ছুঁয়ে দেখো।" },
    en: { meaning: "The Soft and Careful One",
          about: "Allah notices tiny things too. Even an ant's little foot.",
          today: "Touch a leaf today with the softest hands you can." } },

  { n: 42, i: 1, ar: "الْكَرِيمُ", tr: "Al-Kareem",
    bn: { meaning: "যিনি অনেক বেশি দেন",
          about: "তুমি একটু চাও, আল্লাহ অনেক দেন। তিনি কম দিতে জানেন না।",
          today: "আজকে তোমার খাবারের অর্ধেক কারো সাথে ভাগ করো।" },
    en: { meaning: "The Generous One",
          about: "You ask for a little and Allah gives a lot. He does not know how to give small.",
          today: "Share half of your food with someone today." } },

  /* ---------- 2. ক্ষমার দ্বীপ / Island of Forgiveness ---------- */

  { n: 14, i: 2, ar: "الْغَفَّارُ", tr: "Al-Ghaffār",
    bn: { meaning: "যিনি বারবার মাফ করেন",
          about: "একই ভুল বারবার করলেও আল্লাহ আবার মাফ করেন। তিনি ক্লান্ত হন না।",
          today: "আজকে কেউ তোমাকে দুইবার বিরক্ত করলেও মাফ করে দাও।" },
    en: { meaning: "The One Who Forgives Again and Again",
          about: "Even if you make the same mistake many times, Allah forgives again. He does not get tired of it.",
          today: "If someone annoys you twice today, forgive them anyway." } },

  { n: 34, i: 2, ar: "الْغَفُورُ", tr: "Al-Ghafoor",
    bn: { meaning: "যিনি ভুল ঢেকে দেন",
          about: "তুমি লুকিয়ে ভুল করলে আল্লাহ তা সবাইকে বলে দেন না। তিনি ঢেকে রাখেন।",
          today: "আজকে কারো ভুল নিয়ে হাসবে না। চুপ করে থাকো।" },
    en: { meaning: "The One Who Covers Mistakes",
          about: "When you slip up in secret, Allah does not announce it to everyone. He covers it over.",
          today: "Do not laugh at anyone's mistake today. Stay quiet instead." } },

  { n: 80, i: 2, ar: "التَّوَّابُ", tr: "At-Tawwāb",
    bn: { meaning: "যিনি ফিরে এলে খুশি হন",
          about: "তুমি সরি বলে ফিরে এলে আল্লাহ খুব খুশি হন। দরজা কখনো বন্ধ হয় না।",
          today: "আজকে যার সাথে ঝগড়া হয়েছে, তার কাছে গিয়ে সরি বলো।" },
    en: { meaning: "The One Who Is Happy When You Come Back",
          about: "When you say sorry and come back, Allah is glad. The door never shuts.",
          today: "Go and say sorry today to whoever you argued with." } },

  { n: 82, i: 2, ar: "الْعَفُوُّ", tr: "Al-'Afuww",
    bn: { meaning: "যিনি একেবারে মুছে দেন",
          about: "আল্লাহ মাফ করলে ভুলটা একদম মুছে যায়। যেন হয়ইনি।",
          today: "আজকে পুরোনো কোনো ঝগড়ার কথা আর তুলবে না।" },
    en: { meaning: "The One Who Wipes It Clean",
          about: "When Allah forgives, the mistake is wiped away completely. As if it never happened.",
          today: "Do not bring up an old argument today. Let it go." } },

  { n: 35, i: 2, ar: "الشَّكُورُ", tr: "Ash-Shakoor",
    bn: { meaning: "যিনি ছোট কাজের জন্যও ধন্যবাদ দেন",
          about: "তুমি অল্প একটু ভালো কাজ করলে আল্লাহ অনেক বড় পুরস্কার দেন।",
          today: "আজকে তিনজনকে ধন্যবাদ বলো।" },
    en: { meaning: "The One Who Says Thank You",
          about: "You do one small good thing and Allah gives back something huge.",
          today: "Say thank you to three people today." } },

  { n: 44, i: 2, ar: "الْمُجِيبُ", tr: "Al-Mujeeb",
    bn: { meaning: "যিনি ডাক শোনেন আর উত্তর দেন",
          about: "তুমি মনে মনে ডাকলেও আল্লাহ শোনেন। তিনি কখনো পরে আসো বলেন না।",
          today: "আজকে ঘুমানোর আগে আল্লাহর কাছে একটা জিনিস চাও।" },
    en: { meaning: "The One Who Answers",
          about: "Even when you call Allah inside your head, He hears. He never says come back later.",
          today: "Ask Allah for one thing tonight before you sleep." } },

  { n: 4, i: 2, ar: "الْقُدُّوسُ", tr: "Al-Quddūs",
    bn: { meaning: "যাঁর মধ্যে কোনো দোষ নেই",
          about: "আল্লাহ একেবারে পরিষ্কার আর নিখুঁত। কোনো ভুল নেই, কোনো ময়লা নেই।",
          today: "আজকে নিজের হাত আর দাঁত খুব ভালো করে পরিষ্কার করো।" },
    en: { meaning: "The Perfectly Pure One",
          about: "Allah is completely clean and perfect. No mistakes, nothing dirty.",
          today: "Wash your hands and brush your teeth really properly today." } },

  { n: 5, i: 2, ar: "السَّلَامُ", tr: "As-Salām",
    bn: { meaning: "যিনি শান্তি দেন",
          about: "আল্লাহর কাছে গেলে মন শান্ত হয়ে যায়। ভয় কমে যায়।",
          today: "আজকে যাকে দেখবে তাকে আসসালামু আলাইকুম বলো।" },
    en: { meaning: "The One Who Gives Peace",
          about: "When you turn to Allah your heart goes quiet. The scared feeling gets smaller.",
          today: "Say assalamu alaikum to everyone you see today." } },

  { n: 6, i: 2, ar: "الْمُؤْمِنُ", tr: "Al-Mu'min",
    bn: { meaning: "যিনি নিরাপদ রাখেন",
          about: "আল্লাহ পাহারা দেন। তুমি ঘুমিয়ে থাকলেও তিনি জেগে থাকেন।",
          today: "আজকে ভয় লাগলে বলো, আল্লাহ আছেন।" },
    en: { meaning: "The One Who Keeps You Safe",
          about: "Allah stands guard. Even when you are asleep, He is awake.",
          today: "If you feel scared today, say: Allah is here." } },

  /* ---------- 3. রাজার দ্বীপ / Island of the King ---------- */

  { n: 3, i: 3, ar: "الْمَلِكُ", tr: "Al-Malik",
    bn: { meaning: "সবার রাজা",
          about: "আল্লাহ সবকিছুর রাজা। আকাশ, মাটি, সমুদ্র — সব তাঁর।",
          today: "আজকে তোমার সবচেয়ে প্রিয় খেলনাটা একজনকে ধরতে দাও।" },
    en: { meaning: "The King",
          about: "Allah is King of everything. The sky, the ground, the sea — all His.",
          today: "Let someone else hold your favourite toy today." } },

  { n: 84, i: 3, ar: "مَالِكُ الْمُلْكِ", tr: "Mālik-ul-Mulk",

          today: "আজকে এটা আমার না বলে এটা আমাদের বলে দেখো।" },
    en: { meaning: "The Owner of Everything",
          about: "Your house, your clothes — they are really Allah's. He has lent them to us.",
          today: "Try saying ours today instead of mine." } },

  { n: 8, i: 3, ar: "الْعَزِيزُ", tr: "Al-'Azeez",
    bn: { meaning: "যিনি কখনো হারেন না",
          about: "আল্লাহকে কেউ হারাতে পারে না। তিনি সবসময় জেতেন।",
          today: "আজকে কোনো খেলায় হেরে গেলেও হেসে হাত মেলাও।" },
    en: { meaning: "The Strong One Who Never Loses",
          about: "Nobody can beat Allah. He always wins.",
          today: "If you lose a game today, smile and shake hands anyway." } },

  { n: 9, i: 3, ar: "الْجَبَّارُ", tr: "Al-Jabbār",
    bn: { meaning: "যিনি ভাঙা জিনিস ঠিক করে দেন",
          about: "হাড় ভাঙলে আল্লাহ জোড়া লাগান। মন ভাঙলেও তিনি ঠিক করে দেন।",
          today: "আজকে ভাঙা বা এলোমেলো একটা জিনিস ঠিক করে রাখো।" },
    en: { meaning: "The One Who Mends What Is Broken",
          about: "When a bone breaks, Allah joins it back. When a heart breaks, He mends that too.",
          today: "Fix or tidy one broken thing today." } },

  { n: 10, i: 3, ar: "الْمُتَكَبِّرُ", tr: "Al-Mutakabbir",
    bn: { meaning: "যিনি সবার চেয়ে বড়",
          about: "শুধু আল্লাহ বড়াই করতে পারেন, কারণ তিনি সত্যিই সবার চেয়ে বড়।",
          today: "আজকে নিজের কোনো কিছু নিয়ে বড়াই করবে না।" },
    en: { meaning: "The Greatest One",
          about: "Only Allah can boast, because He really is greater than everyone.",
          today: "Do not show off about anything today." } },

  { n: 15, i: 3, ar: "الْقَهَّارُ", tr: "Al-Qahhār",
    bn: { meaning: "যাঁর হাতে সব কিছুর ক্ষমতা",
          about: "বড় বড় ঝড়, পাহাড়, সমুদ্র — সব আল্লাহর কথা শোনে।",
          today: "আজকে আম্মু বা আব্বু ডাকলে প্রথম ডাকেই যাও।" },
    en: { meaning: "The One in Full Control",
          about: "Huge storms, mountains, the sea — they all listen to Allah.",
          today: "When you are called today, come the first time." } },

  { n: 77, i: 3, ar: "الْوَالِي", tr: "Al-Wālī",
    bn: { meaning: "যিনি সব কিছু চালান",
          about: "সূর্য কখন উঠবে, বৃষ্টি কখন হবে — সব আল্লাহ ঠিক করে চালান।",
          today: "আজকে সূর্য ডোবা পর্যন্ত এক মিনিট তাকিয়ে দেখো।" },
    en: { meaning: "The One Who Runs Everything",
          about: "When the sun comes up, when the rain falls — Allah runs all of it.",
          today: "Watch the sun going down for one whole minute today." } },

  { n: 78, i: 3, ar: "الْمُتَعَالِي", tr: "Al-Muta'ālī",
    bn: { meaning: "যিনি সবার অনেক উপরে",
          about: "আকাশের চেয়েও উপরে, তারার চেয়েও উপরে — আল্লাহ সবার উপরে।",
          today: "আজকে রাতে আকাশের দিকে তাকিয়ে তারা গোনো।" },
    en: { meaning: "The One Higher Than Everything",
          about: "Higher than the sky, higher than the stars — Allah is above everything.",
          today: "Look up tonight and count the stars." } },

  { n: 7, i: 3, ar: "الْمُهَيْمِنُ", tr: "Al-Muhaymin",
    bn: { meaning: "যিনি পাহারা দিয়ে রাখেন",
          about: "আল্লাহ সব কিছুর উপর নজর রাখেন। কিছুই তাঁর চোখ এড়ায় না।",
          today: "আজকে ছোট কারো দিকে খেয়াল রাখো, যেন সে ব্যথা না পায়।" },
    en: { meaning: "The Watchful Guard",
          about: "Allah keeps watch over everything. Nothing slips past Him.",
          today: "Keep an eye on someone smaller today so they do not get hurt." } },

  /* ---------- 4. সৃষ্টির দ্বীপ / Island of Making ---------- */

  { n: 11, i: 4, ar: "الْخَالِقُ", tr: "Al-Khāliq",
    bn: { meaning: "যিনি সব বানিয়েছেন",
          about: "কিছুই ছিল না। আল্লাহ বললেন হও, আর সব হয়ে গেল।",
          today: "আজকে কাগজ বা মাটি দিয়ে নিজের হাতে কিছু বানাও।" },
    en: { meaning: "The Maker",
          about: "There was nothing at all. Allah said be, and everything was.",
          today: "Make something with your own hands today — paper, clay, anything." } },

  { n: 12, i: 4, ar: "الْبَارِئُ", tr: "Al-Bāri'",
    bn: { meaning: "যিনি নকল না করে বানান",
          about: "আল্লাহ কারো দেখে বানাননি। সব তাঁর নিজের নতুন ভাবনা।",
          today: "আজকে এমন একটা ছবি আঁকো যা আগে কেউ আঁকেনি।" },
    en: { meaning: "The One Who Makes Without Copying",
          about: "Allah did not copy anyone. Every idea was His own, brand new.",
          today: "Draw something today that nobody has ever drawn before." } },

  { n: 13, i: 4, ar: "الْمُصَوِّرُ", tr: "Al-Musawwir",
    bn: { meaning: "যিনি সুন্দর আকার দেন",
          about: "প্রজাপতির ডানা, তোমার আঙুল — সব আল্লাহ যত্ন করে আকার দিয়েছেন।",
          today: "আজকে নিজের আঙুলগুলো ভালো করে দেখো। কত সুন্দর!" },
    en: { meaning: "The One Who Shapes Things",
          about: "A butterfly's wing, your fingers — Allah shaped each one carefully.",
          today: "Look closely at your own fingers today. Aren't they beautiful?" } },

  { n: 95, i: 4, ar: "الْبَدِيعُ", tr: "Al-Badee'",
    bn: { meaning: "যিনি অবাক করা জিনিস বানান",

          today: "Water a dry plant today." } },

  { n: 60, i: 4, ar: "الْمُحْيِي", tr: "Al-Muhyī",

          about: "ছোট্ট একটা বীজ থেকে বড় গাছ। আল্লাহ প্রাণ দেন।",

    en: { meaning: "The One Who Ends Life",
          about: "One day everyone goes back to Allah. That is not scary — it is going home.",
          today: "Make one dua today for someone who has passed away." } },

          about: "তুমি যেমন ঘুম থেকে ওঠো, তেমনি একদিন আল্লাহ সবাইকে আবার জাগাবেন।",
          today: "আজকে ঘুম থেকে উঠে বলো, আলহামদুলিল্লাহ।" },
    en: { meaning: "The One Who Wakes Everyone Again",
          about: "Just like you wake up from sleep, one day Allah will wake everyone up again.",
          today: "Say alhamdulillah the moment you wake up today." } },

    bn: { meaning: "যিনি সবার খাবার দেন",

    en: { meaning: "The One Who Feeds Everyone",

  { n: 16, i: 5, ar: "الْوَهَّابُ", tr: "Al-Wahhāb",

    en: { meaning: "The Gift Giver",

          today: "Give someone a small present today." } },

  { n: 18, i: 5, ar: "الْفَتَّاحُ", tr: "Al-Fattāh",
    bn: { meaning: "যিনি বন্ধ দরজা খুলে দেন",

          today: "Try that hard thing one more time today." } },

  { n: 45, i: 5, ar: "الْوَاسِعُ", tr: "Al-Wāsi'",

          today: "Pick someone for your game today who never gets picked." } },

          today: "Open both arms wide and hug someone today." } },

  { n: 20, i: 5, ar: "الْقَابِضُ", tr: "Al-Qābid",

          about: "Allah keeps you safe. He also saves up every good thing you do.",

(function () {

  var MEM = {};                       // fallback when storage is unavailable

    MEM[key] = value;
    try { window.localStorage.setItem(K + key, value); } catch (e) { /* private mode */ }
  }

    try { window.localStorage.removeItem(K + key); } catch (e) { /* ignore */ }
  }

    var n = 0;
    for (var k = 1; k <= TOTAL_ISLANDS; k++) {

    for (var k = 0; k < all.length; k++) all[k].classList.remove("on");

  function shuffle(list) {
    var a = list.slice();
    for (var k = a.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = a[k]; a[k] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ---------- the map: an ocean chart with the islands on it ---------- */

  var MAP_W = 100;          // chart width in svg units

  var PLATE_TUCK = 0.18;    // how far the label sits up over the shore
  var GAP_PAD = 12;         // clear water between a label and the next island
  var ART_MAX = 190;        // an island stops growing past this, or a tablet
                            // ends up scrolling five screens to reach the end

  /* An island's drawn size. Matches Chart.artSizeDp in the native build. */
  function artSize(widthPx, isl) {
    return Math.min(widthPx * (ISLE_W / 100) * 1.32 * isl.size, ART_MAX * isl.size);
  }

  /* How tall the chart has to be so no label reaches the island below it.

     island are not the same pair, and treating them as one made the chart far

    for (var i = 0; i < isles.length; i++) {
      var isl = ISLANDS[i];
      if (isl) isles[i].style.width = artSize(w, isl) + "px";
    }

    chart.style.height = Math.round(chartHeight(w, 58)) + "px";
    var plates = chart.querySelectorAll(".isle .plate");
    var tallest = 0;
    for (var k = 0; k < plates.length; k++) {
      tallest = Math.max(tallest, plates[k].offsetHeight);
    }
    if (tallest > 0) {
      chart.style.height = Math.round(chartHeight(w, tallest)) + "px";
    }
  }

  /* One island colour, lightened or darkened. Keeps every face of the land
     on the same hue so it reads as one object lit from one side. */
  function shade(isl, dl, ds) {
    var sat = Math.max(0, Math.min(100, isl.sat + (ds || 0)));
    var light = Math.max(0, Math.min(100, isl.light + dl));
    return "hsl(" + isl.hue + " " + sat + "% " + light + "%)";
  }

  function mapX(isl) { return isl.x * MAP_W; }
  function mapY(isl) { return isl.y * MAP_H; }

  function svgEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* One leg of the sailing route, bent so the line looks sailed rather than ruled. */
  function legPath(from, to, pull) {
    var x1 = mapX(from), y1 = mapY(from), x2 = mapX(to), y2 = mapY(to);
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    // push the midpoint sideways, alternating, for a lazy S down the chart
    var nx = -(y2 - y1), ny = x2 - x1;
    var len = Math.sqrt(nx * nx + ny * ny) || 1;
    return "M" + x1 + "," + y1 +
           " Q" + (mx + nx / len * pull) + "," + (my + ny / len * pull) +
           " " + x2 + "," + y2;
  }

  function oceanDefs() {
    var defs = svgEl("defs");

    // shallow tropical water: pale at the top where the sun is, deeper below
    var water = svgEl("linearGradient", { id: "water", x1: "0", y1: "0", x2: "0.25", y2: "1" });
    [["0%", "#cdeaf1"], ["30%", "#a9dce8"], ["68%", "#7ec9da"], ["100%", "#5fb7cc"]]
      .forEach(function (stop) {
        water.appendChild(svgEl("stop", { offset: stop[0], "stop-color": stop[1] }));
      });
    defs.appendChild(water);

    // sunlight off the top corner
    var sun = svgEl("radialGradient", { id: "sunglow" });
    sun.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#fffdf0", "stop-opacity": ".72" }));
    sun.appendChild(svgEl("stop", { offset: "55%", "stop-color": "#fff6d8", "stop-opacity": ".22" }));
    sun.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#fff6d8", "stop-opacity": "0" }));
    defs.appendChild(sun);

    ISLANDS.forEach(function (isl) {
      // lit from the top-left, like the sun is
      var g = svgEl("linearGradient", { id: "land" + isl.i, x1: "0.15", y1: "0", x2: "0.75", y2: "1" });
      g.appendChild(svgEl("stop", { offset: "0%", "stop-color": shade(isl, 8) }));
      g.appendChild(svgEl("stop", { offset: "55%", "stop-color": shade(isl, 0) }));
      g.appendChild(svgEl("stop", { offset: "100%", "stop-color": shade(isl, -9) }));
      defs.appendChild(g);

      // the paler ring of water an island sits in
      var shallow = svgEl("radialGradient", { id: "shallow" + isl.i });
      shallow.appendChild(svgEl("stop", { offset: "38%", "stop-color": "#e6f7f3", "stop-opacity": "0" }));
      shallow.appendChild(svgEl("stop", { offset: "60%", "stop-color": "#dff5f0", "stop-opacity": ".70" }));
      shallow.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#cfeef0", "stop-opacity": "0" }));
      defs.appendChild(shallow);
    });

    // islands not reached yet sit under a haze
    var soften = svgEl("filter", { id: "soften", x: "-30%", y: "-30%", width: "160%", height: "160%" });
    soften.appendChild(svgEl("feGaussianBlur", { stdDeviation: "2.4" }));
    defs.appendChild(soften);

    var haze = svgEl("radialGradient", { id: "haze" });
    haze.appendChild(svgEl("stop", { offset: "35%", "stop-color": "#ffffff", "stop-opacity": ".62" }));
    haze.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#ffffff", "stop-opacity": "0" }));
    defs.appendChild(haze);

    return defs;
  }

  /* Swell lines across the whole chart. Cheap, and they read as water. */
  function swell() {
    var g = svgEl("g", { class: "swell" });
    for (var y = 4; y < MAP_H; y += 5.5) {
      var d = "M-12," + y.toFixed(1);
      for (var x = -12; x <= MAP_W + 12; x += 8) {
        var lift = (((x + y) % 3) - 1) * 0.5;
        d += " q4," + lift.toFixed(2) + " 8,0";
      }
      g.appendChild(svgEl("path", {
        d: d,
        fill: "none",
        stroke: "#ffffff",
        "stroke-width": y % 11 < 5.5 ? 0.26 : 0.15,
        "stroke-opacity": 0.30,
        "stroke-linecap": "round",
      }));
    }
    return g;
  }

  /* ---------------------------------------------------------------------
     Isometric islands.

     No 3D engine here: the coastline is a shape lying on the ground, and an
     oblique projection tilts that ground away from the viewer. Squash y,
     subtract height for z, and an outline becomes a solid you can walk around.

        screen.x = x
        screen.y = y * SQUASH - z

     The land is then extruded: every coastline edge on the near side becomes
     a wall, shaded by which way it faces. That per-face shading is what makes
     it read as a solid object rather than a sticker.
     --------------------------------------------------------------------- */

  var SQUASH = 0.54;        // how far the ground tilts away
  var ISLE_H = 0.46;        // island height, as a fraction of its radius
  var SAMPLES = 44;         // points around the coastline
  var LIGHT = { x: -0.55, y: -0.83 };   // sun, upper-left

  /* Each island draws in its own <svg>, so it carries its own gradient. */
  function islandDefs(isl) {
    var defs = svgEl("defs");
    var g = svgEl("linearGradient", { id: "top" + isl.i, x1: "0.15", y1: "0", x2: "0.75", y2: "1" });
    g.appendChild(svgEl("stop", { offset: "0%", "stop-color": shade(isl, 10) }));
    g.appendChild(svgEl("stop", { offset: "60%", "stop-color": shade(isl, 0) }));
    g.appendChild(svgEl("stop", { offset: "100%", "stop-color": shade(isl, -7) }));
    defs.appendChild(g);

    var soften = svgEl("filter", { id: "soft" + isl.i, x: "-40%", y: "-40%", width: "180%", height: "180%" });
    soften.appendChild(svgEl("feGaussianBlur", { stdDeviation: "2.2" }));
    defs.appendChild(soften);
    return defs;
  }

  function iso(x, y, z) {
    return { x: x, y: y * SQUASH - z };
  }

  /* Brightness of a wall facing outward along (nx, ny), 0 dark .. 1 lit. */
  function faceLight(nx, ny) {
    var d = nx * LIGHT.x + ny * LIGHT.y;         // -1 facing away .. 1 facing sun
    return 0.5 + 0.5 * d;
  }

  function polygon(points, fill, extra) {
    var attrs = {
      points: points.map(function (p) { return p.x.toFixed(2) + "," + p.y.toFixed(2); }).join(" "),
      fill: fill,
    };
    for (var k in extra) if (extra.hasOwnProperty(k)) attrs[k] = extra[k];
    return svgEl("polygon", attrs);
  }

  function islandArt(isl, open) {
    // needs its own <svg> root: a bare <g> has no SVG context to draw in
    var svg = svgEl("svg", { viewBox: "0 0 100 100", "aria-hidden": "true" });
    svg.appendChild(islandDefs(isl));
    var g = svgEl("g", { class: "isleart" });
    svg.appendChild(g);
    var pts = coastPoints(isl.seed, SAMPLES);

    // the art box is 2.6 radii wide, leaving room for the shadow and the drop
    var R = 41;
    var H = R * ISLE_H;
    var cx = 50, cy = 44;

    var top = pts.map(function (p) { 
      var q = iso(p.x * R, p.y * R, H);
      return { x: cx + q.x, y: cy + q.y };
    });
    var base = pts.map(function (p) {
      var q = iso(p.x * R, p.y * R, 0);
      return { x: cx + q.x, y: cy + q.y };
    });

    // --- the shadow it casts on the water ---
    var shadow = pts.map(function (p) {
      var q = iso(p.x * R * 1.02, p.y * R * 1.02, 0);
      return { x: cx + q.x + H * 0.55, y: cy + q.y + H * 0.30 };
    });
    g.appendChild(polygon(shadow, open ? "rgba(23,86,104,.22)" : "rgba(23,86,104,.10)"));

    // --- the shallows it sits in ---
    var shallows = pts.map(function (p) {
      var q = iso(p.x * R * 1.30, p.y * R * 1.30, 0);
      return { x: cx + q.x, y: cy + q.y };
    });
    g.appendChild(polygon(shallows, open ? "rgba(223,245,240,.62)" : "rgba(255,255,255,.55)", {
      filter: "url(#soft" + isl.i + ")",
    }));

    // --- the walls, near side only, each shaded by the way it faces ---
    for (var k = 0; k < SAMPLES; k++) {
      var j = (k + 1) % SAMPLES;
      // outward normal of this edge, on the ground plane
      var nx = (pts[k].x + pts[j].x) / 2;
      var ny = (pts[k].y + pts[j].y) / 2;
      var len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;
      if (ny <= 0) continue;               // facing away: hidden behind the top

      var lit = faceLight(nx, ny);
      var wall = open
        ? shade(isl, -16 - 16 * (1 - lit), 4)
        : "hsl(205 12% " + (58 + 10 * lit).toFixed(0) + "%)";
      g.appendChild(polygon([top[k], top[j], base[j], base[k]], wall));
    }

    // --- a band of sand just above the waterline ---
    var sandTop = pts.map(function (p) {
      var q = iso(p.x * R, p.y * R, H * 0.26);
      return { x: cx + q.x, y: cy + q.y };
    });
    for (var m = 0; m < SAMPLES; m++) {
      var n = (m + 1) % SAMPLES;
      var sx = (pts[m].x + pts[n].x) / 2, sy = (pts[m].y + pts[n].y) / 2;
      var sl = Math.hypot(sx, sy) || 1;
      if (sy / sl <= 0) continue;
      g.appendChild(polygon([sandTop[m], sandTop[n], base[n], base[m]],
        open ? "#f3e2bd" : "#dfe6e9"));
    }

    // --- the top: the island's own colour, lit from the upper left ---
    g.appendChild(polygon(top, open ? "url(#top" + isl.i + ")" : "#cfd9de"));
    // a soft inner highlight so the top does not read as flat card
    var crown = pts.map(function (p) {
      var q = iso(p.x * R * 0.62, p.y * R * 0.62 - R * 0.10, H);
      return { x: cx + q.x, y: cy + q.y };
    });
    g.appendChild(polygon(crown, open ? shade(isl, 9) : "#dae2e6", { opacity: open ? 0.55 : 0.4 }));

    return svg;
  }

  function paintMap() {
    el("map-title").textContent = t("journey");
    el("map-sub").textContent = t("subtitle");
    el("map-who").textContent = t("playingAs", S.who);
    el("map-all").textContent = t("viewAll");

    var lit = islandsLit();
    el("map-count").textContent = t("islandsDone", num(lit), num(TOTAL_ISLANDS));
    el("map-bar").style.width = (lit / TOTAL_ISLANDS * 100) + "%";

    var chart = el("map-chart");
    clear(chart);

    /* ---- the water, the moonlight and the route ---- */
    var sea = svgEl("svg", {
      class: "sea",
      viewBox: "0 0 " + MAP_W + " " + MAP_H,
      preserveAspectRatio: "none",
      "aria-hidden": "true",
    });
    sea.appendChild(oceanDefs());
    sea.appendChild(svgEl("rect", { x: 0, y: 0, width: MAP_W, height: MAP_H, fill: "url(#water)" }));
    sea.appendChild(svgEl("ellipse", { cx: 20, cy: 10, rx: 74, ry: 56, fill: "url(#sunglow)" }));
    sea.appendChild(swell());

    for (var k = 0; k < ISLANDS.length - 1; k++) {
      var from = ISLANDS[k], to = ISLANDS[k + 1];
      var sailed = (S.prog.islands[from.i] || {}).done;
      sea.appendChild(svgEl("path", {
        d: legPath(from, to, k % 2 ? 7 : -7),
        fill: "none",
        stroke: sailed ? "#e08c2c" : "#ffffff",
        "stroke-width": sailed ? 0.75 : 0.55,
        "stroke-opacity": sailed ? 0.9 : 0.6,
        "stroke-linecap": "round",
        "stroke-dasharray": "2.4 3.2",
      }));
    }
    chart.appendChild(sea);

    /* ---- the islands, each one its own tap target ---- */
    ISLANDS.forEach(function (isl) {
      var open = unlocked(isl.i);
      var p = S.prog.islands[isl.i] || { seen: [], stars: 0, done: false };

      var btn = make("button", "isle" + (open ? "" : " locked") + (p.done ? " done" : ""));
      btn.style.left = isl.x * 100 + "%";
      btn.style.top = isl.y * 100 + "%";
      btn.style.width = artSize(chart.clientWidth || 360, isl) + "px";
      btn.style.setProperty("--bob", (-isl.seed * 1.3) + "s");

      var art = make("div", "art");
      art.appendChild(islandArt(isl, open));
      art.appendChild(make("span", "em", open ? isl.emoji : "🔒"));
      if (p.done) art.appendChild(make("span", "flag", "✓"));
      btn.appendChild(art);

      // hangs below the island; still part of the button, so still tappable
      var plate = make("div", "plate");
      plate.appendChild(make("div", "nth", t("nth", num(isl.i))));
      plate.appendChild(make("div", "ttl", S.lang === "bn" ? isl.bn : isl.en));
      if (open) {
        var st = make("div", "stars");
        for (var q = 0; q < 3; q++) st.appendChild(make("span", q < p.stars ? "" : "off", "★"));
        plate.appendChild(st);
      } else {
        plate.appendChild(make("div", "stars locked-note", t("locked")));
      }
      btn.appendChild(plate);

      if (open) {
        btn.addEventListener("click", function () { openIsland(isl.i); });
      } else {
        btn.disabled = true;
      }
      chart.appendChild(btn);
    });

    /* ---- the boat marks the island they are up to ---- */
    var next = null;
    for (var n = 0; n < ISLANDS.length; n++) {
      if (unlocked(ISLANDS[n].i) && !(S.prog.islands[ISLANDS[n].i] || {}).done) {
        next = ISLANDS[n];
        break;
      }
    }
    if (next) {
      var boat = make("div", "boat", "⛵");
      boat.style.left = (next.x * 100 + (next.x > 0.5 ? -19 : 19)) + "%";
      boat.style.top = (next.y * 100 - 1.2) + "%";
      chart.appendChild(boat);
    }

    sizeChart(chart);
  }

  /* ---------- reading the nine cards ---------- */

  function openIsland(no) {
    S.island = no;
    var p = islandProg(no);
    // if they have read everything already, start over at the first card
    S.cardAt = p.seen.length >= 9 ? 0 : Math.min(p.seen.length, 8);
    paintCard();
    show("card");
  }

  function paintCard() {
    var list = namesOf(S.island);
    var item = list[S.cardAt];
    var isl = islandMeta(S.island);
    var p = islandProg(S.island);
    var text = S.lang === "bn" ? item.bn : item.en;

    el("card-island").textContent = S.lang === "bn" ? isl.bn : isl.en;

    var pips = el("card-pips");
    clear(pips);
    for (var k = 0; k < list.length; k++) {
      var cls = k === S.cardAt ? "now" : (p.seen.indexOf(list[k].n) !== -1 ? "seen" : "");
      pips.appendChild(make("i", cls));
    }

    el("card-num").textContent = t("nth", num(S.island)) + " · " + num(S.cardAt + 1) + "/" + num(9);
    el("card-ar").textContent = item.ar;
    el("card-tr").textContent = item.tr;
    el("card-meaning").textContent = text.meaning;
    el("card-about").textContent = text.about;
    el("today-lbl").textContent = t("todayLbl");
    el("today-text").textContent = text.today;

    wireAudio(item.n);

    var back = el("card-back");
    var fwd = el("card-next");
    back.textContent = t("back");
    back.disabled = S.cardAt === 0;
    back.style.opacity = S.cardAt === 0 ? ".4" : "1";
    fwd.textContent = S.cardAt === 8 ? t("toGame") : t("next");

    // mark as read
    if (p.seen.indexOf(item.n) === -1) {
      p.seen.push(item.n);
      if (p.seen.length >= 9 && p.stars < 1) p.stars = 1;
      saveProg();
    }
  }

  /* ---------- audio: works the day the clips land in ./audio, silent until then ---------- */

  var audioCache = {};

  function clipPath(n) {
    return "audio/" + (n < 10 ? "0" + n : String(n)) + ".mp3";
  }

  function wireAudio(n) {
    var btn = el("card-say");
    btn.hidden = true;
    btn.classList.remove("playing");
    btn.textContent = "🔊 " + t("listen");

    var clip = audioCache[n];
    if (clip === "missing") return;

    if (!clip) {
      clip = new Audio(clipPath(n));
      clip.preload = "auto";
      audioCache[n] = clip;
      clip.addEventListener("error", function () {
        audioCache[n] = "missing";
        if (el("card-say")) el("card-say").hidden = true;
      });
      clip.addEventListener("canplaythrough", function () {
        // only reveal if this card is still the one on screen
        if (namesOf(S.island)[S.cardAt] && namesOf(S.island)[S.cardAt].n === n) {
          el("card-say").hidden = false;
        }
      });
    } else if (clip.readyState >= 3) {
      btn.hidden = false;
    }

    btn.onclick = function () {
      var c = audioCache[n];
      if (!c || c === "missing") return;
      c.currentTime = 0;
      btn.classList.add("playing");
      c.onended = function () { btn.classList.remove("playing"); };
      var maybe = c.play();
      if (maybe && maybe.catch) maybe.catch(function () { btn.classList.remove("playing"); });
    };
  }

  /* ---------- the matching game ---------- */

  function startGame() {
    var list = shuffle(namesOf(S.island));
    var rounds = [];
    for (var k = 0; k < list.length; k += PAIRS_PER_ROUND) {
      rounds.push(list.slice(k, k + PAIRS_PER_ROUND));
    }
    S.game = { rounds: rounds, at: 0, mistakes: 0, pickedName: null, pickedMeaning: null, matched: 0 };
    paintGame();
    show("game");
  }

  function paintGame() {
    var g = S.game;
    if (!g) { startGame(); return; }

    var round = g.rounds[g.at];
    el("game-title").textContent = t("gameTitle");
    el("game-sub").textContent = t("gameSub");
    el("game-round").textContent = t("round", num(g.at + 1), num(g.rounds.length));

    var left = el("game-names");
    var right = el("game-meanings");
    clear(left);
    clear(right);
    g.pickedName = null;
    g.pickedMeaning = null;
    g.matched = 0;

    round.forEach(function (item) {
      var tile = make("button", "tile arabic", item.ar);
      tile.dataset.n = item.n;
      tile.addEventListener("click", function () { pick(tile, "name"); });
      left.appendChild(tile);
    });

    shuffle(round).forEach(function (item) {
      var txt = (S.lang === "bn" ? item.bn : item.en).meaning;
      var tile = make("button", "tile", txt);
      tile.dataset.n = item.n;
      tile.addEventListener("click", function () { pick(tile, "meaning"); });
      right.appendChild(tile);
    });
  }

  function pick(tile, side) {
    var g = S.game;
    if (tile.classList.contains("right")) return;

    var key = side === "name" ? "pickedName" : "pickedMeaning";
    var other = side === "name" ? "pickedMeaning" : "pickedName";

    if (g[key] === tile) {                 // tapping the same tile clears it
      tile.classList.remove("picked");
      g[key] = null;
      return;
    }
    if (g[key]) g[key].classList.remove("picked");
    g[key] = tile;
    tile.classList.add("picked");

    if (!g[other]) return;

    var a = g[key], b = g[other];
    if (a.dataset.n === b.dataset.n) {
      a.classList.remove("picked"); b.classList.remove("picked");
      a.classList.add("right"); b.classList.add("right");
      g.pickedName = null; g.pickedMeaning = null;
      g.matched++;
      if (g.matched >= g.rounds[g.at].length) window.setTimeout(nextRound, 420);
    } else {
      g.mistakes++;
      a.classList.add("wrong"); b.classList.add("wrong");
      var pair = [a, b];
      window.setTimeout(function () {
        pair.forEach(function (x) { x.classList.remove("wrong", "picked"); });
      }, 340);
      g.pickedName = null; g.pickedMeaning = null;
    }
  }

  function nextRound() {
    var g = S.game;
    g.at++;
    if (g.at < g.rounds.length) { paintGame(); return; }

    var p = islandProg(S.island);
    var earned = g.mistakes === 0 ? 3 : 2;
    if (earned > p.stars) p.stars = earned;
    p.done = true;
    saveProg();
    paintFinish();
    show("finish");
  }

  /* ---------- island finished ---------- */

  function paintFinish() {
    var isl = islandMeta(S.island);
    var p = islandProg(S.island);
    var lastCard = namesOf(S.island)[8];
    var text = S.lang === "bn" ? lastCard.bn : lastCard.en;
    var allDone = islandsLit() >= TOTAL_ISLANDS;

    el("fin-em").textContent = isl.emoji;
    el("fin-title").textContent = t("wellDone");

    var got = el("fin-stars");
    clear(got);
    for (var k = 0; k < 3; k++) got.appendChild(make("span", k < p.stars ? "" : "off", "★"));

    el("fin-name").textContent = S.lang === "bn" ? isl.bn : isl.en;
    el("fin-sub").textContent = allDone ? t("lastIsland") : t("finishSub");

    el("fin-today-lbl").textContent = t("todayLbl");
    el("fin-today").textContent = text.today;
    el("fin-back").textContent = t("backToMap");
  }

  /* ---------- the full 99, traditional order ---------- */

  function paintAll() {
    el("all-title").textContent = t("allNames");
    el("all-sub").textContent = t("allSub");

    var box = el("all-list");
    clear(box);

    NAMES.slice().sort(function (a, b) { return a.n - b.n; }).forEach(function (item) {
      var text = S.lang === "bn" ? item.bn : item.en;
      var row = make("button", "one");
      row.appendChild(make("span", "idx", num(item.n)));
      row.appendChild(make("span", "ar", item.ar));
      var txt = make("span", "txt");
      txt.appendChild(make("b", null, text.meaning));
      txt.appendChild(make("small", null, item.tr));
      row.appendChild(txt);
      row.addEventListener("click", function () { openSheet(item); });
      box.appendChild(row);
    });
  }

  function openSheet(item) {
    var text = S.lang === "bn" ? item.bn : item.en;
    el("sh-num").textContent = t("nth", num(item.i)) + " · " + num(item.n) + "/" + num(99);
    el("sh-ar").textContent = item.ar;
    el("sh-tr").textContent = item.tr;
    el("sh-meaning").textContent = text.meaning;
    el("sh-about").textContent = text.about;
    el("sh-today-lbl").textContent = t("todayLbl");
    el("sh-today").textContent = text.today;
    el("sheet").classList.add("on");
  }

  /* ---------- the light behind everything ---------- */

  /* Soft shapes drifting slowly, in the colours of the rug. Replaces the
     star field, which needed a dark screen to read at all. */
  function sprinkleBokeh() {
    var sky = el("bokeh");
    if (!sky) return;
    var tints = ["#f7cdb0", "#cdbfe0", "#a9dcc4", "#f5ce63", "#9fd8e4", "#f0907a"];
    var frag = document.createDocumentFragment();
    for (var k = 0; k < 10; k++) {
      var b = make("i");
      var size = 70 + (k % 5) * 40;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = ((k * 37) % 100) + "%";
      b.style.top = ((k * 53) % 100) + "%";
      b.style.background = tints[k % tints.length];
      b.style.opacity = k % 3 === 0 ? ".13" : ".09";
      b.style.animationDelay = (-k * 1.7) + "s";
      b.style.animationDuration = (18 + (k % 4) * 5) + "s";
      frag.appendChild(b);
    }
    sky.appendChild(frag);
  }

  /* ---------- wiring ---------- */

  function boot() {
    sprinkleBokeh();
    document.documentElement.lang = S.lang === "bn" ? "bn" : "en";
    paintLangButtons();

    var langBtns = document.querySelectorAll("[data-lang]");
    for (var k = 0; k < langBtns.length; k++) {
      (function (b) {
        b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
      })(langBtns[k]);
    }

    el("pw-add").addEventListener("click", addProfile);
    el("pw-input").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") addProfile();
    });

    el("card-back").addEventListener("click", function () {
      if (S.cardAt > 0) { S.cardAt--; paintCard(); }
    });
    el("card-next").addEventListener("click", function () {
      if (S.cardAt < 8) { S.cardAt++; paintCard(); }
      else startGame();
    });
    el("card-quit").addEventListener("click", function () { paintMap(); show("map"); });

    el("game-quit").addEventListener("click", function () { paintMap(); show("map"); });
    el("fin-back").addEventListener("click", function () { paintMap(); show("map"); });

    el("map-all").addEventListener("click", function () { paintAll(); show("all"); });
    el("all-back").addEventListener("click", function () { paintMap(); show("map"); });
    el("map-who").addEventListener("click", function () { paintProfiles(); show("profiles"); });

    el("sheet").addEventListener("click", function (ev) {
      if (ev.target === el("sheet")) el("sheet").classList.remove("on");
    });
    el("sh-close").addEventListener("click", function () {
      el("sheet").classList.remove("on");
    });

    window.addEventListener("resize", function () {
      var chart = el("map-chart");
      if (chart && chart.childNodes.length) sizeChart(chart);
    });

    // straight back into the last journey, if there is one
    var last = get("last");
    if (last && profiles().indexOf(last) !== -1) {
      useProfile(last);
    } else {
      paintProfiles();
      show("profiles");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
